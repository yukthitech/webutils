<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Enum LOV Demo</title>
	<link href="/lib/bootstrap-5.1.0/css/bootstrap.min.css" rel="stylesheet">
	<link href="/lib/bootstrap-select-1.14.0/bootstrap-select.min.css" rel="stylesheet">
	<link href="/lib/bootstrap-icons-1.3.0/bootstrap-icons.css" rel="stylesheet">
	<link href="/lib/webutils/webutils.css" rel="stylesheet">
	<link href="/common/app.css" rel="stylesheet">
	<script src="/lib/jquery-3.6.0/jquery.min.js"></script>
	<script src="/lib/popper-2.9.3/popper.min.js"></script>
	<script src="/lib/bootstrap-5.1.0/js/bootstrap.min.js"></script>
	<script src="/lib/bootstrap-select-1.14.0/bootstrap-select.min.js"></script>
	<script type="module" src="/common/app-config.js"></script>
</head>
<body>
	<div id="webutilsPageLoading" class="p-3">Loading…</div>
	<div id="ykApp" class="container" style="display:none;">
		<header class="testapp-header">
			<h1 id="enum-lov-demo-title">Enum LOV Demo</h1>
			<p>Single and multi enum LOV via <code>yk-lov-field</code> (STATIC). Five statuses enable search (&gt; 3 options).</p>
		</header>

		<nav class="testapp-nav">
			<a href="/index.html">Home</a>
			<a href="/login/login.html">Login</a>
			<a href="/widgets/editable-lov-demo.html">Editable LOV</a>
			<a href="/widgets/multi-editable-lov-demo.html">Multi Editable LOV</a>
			<a href="/widgets/simple-lov-demo.html">Simple LOV</a>
			<a class="active" href="/widgets/enum-lov-demo.html">Enum LOV</a>
			<a href="/widgets/otp-demo.html">OTP</a>
			<a href="/widgets/search-demo.html">Search</a>
		</nav>

		<section class="testapp-panel">
			<h2>Model form</h2>
			<yk-model-form id="enum-lov-demo-form" ref="lovForm" model-name="EnumLovDemoModel" :column-count="1"
				v-model="formData" :enable-error="submitTried" :server-errors="fieldErrors">
				<template #footer>
					<div style="float: right;">
						<div id="enum-lov-demo-error" class="webutils-error">{{ error }}</div>
						<button id="enum-lov-demo-submit-btn" type="button" class="webutils-btn-primary"
							@click.prevent="submitForm">Submit</button>
					</div>
				</template>
			</yk-model-form>
		</section>

		<section class="testapp-panel" v-if="lastResponse">
			<h2>Last response</h2>
			<pre id="enum-lov-demo-response">{{ JSON.stringify(lastResponse, null, 2) }}</pre>
		</section>

		<yk-dialogs ref="ykDialogs"></yk-dialogs>
	</div>

	<script type="module" src="/widgets/enum-lov-demo.js"></script>
</body>
</html>
